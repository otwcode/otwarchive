        reset_emails_clarification:
          html: 收到您未提出的重置密码邮件并不一定代表您的%{app_name}账号存在风险。只要只有您本人可以访问您的电子邮箱账号，您的%{app_name}账号将不受影响，您的密码也不会只因您收到此重置密码邮件而自动更换。不过，您还是能够%{choose_new_password_link_modal}或者登录账号并%{change_your_password_link}。两者都将使您的账号从所有设备上退出。
          text: 收到您未提出的重置密码邮件并不一定代表您的%{app_name}账号存在风险。只要只有您本人可以访问您的电子邮箱账号，您的%{app_name}账号将不受影响，您的密码也不会只因您收到此重置密码邮件而自动更换。不过您还是能够使用此链接设置新密码（%{choose_new_password_url}）或者登录账号并更换您的密码（%{change_your_password_url}）。两者都将使您的账号从所有设备上退出。
