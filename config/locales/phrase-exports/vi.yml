        html: Nếu bạn đã đăng tải những tác phẩm này và %{negation} dùng tính năng
          nhập liệu từ URL, tác phẩm đấy sẽ có 2 bản trên AO3. Bởi vì AO3 không cho
          phép có tác phẩm trùng lặp, vui lòng xóa 1 trong 2 bản. Bạn có quyền quyết
          định giữ bản sao nào. Tuy nhiên, nếu bạn xóa bản sao được nhập liệu bởi
          Open Doors, chúng tôi khuyến khích bạn thêm bản sao còn lại vào Bộ Sưu Tập
          của kho tàng đó trên AO3. Nếu bạn có câu hỏi về cách xóa hoặc thêm tác phẩm
          vào bộ sưu tập, truy cập %{faq_link} của AO3.
