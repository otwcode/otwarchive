              lòng đợi vài giờ và thử lại. Nếu sự cố vẫn tồn tại sau hơn một ngày,
              vui lòng liên hệ Ban Hỗ trợ Kỹ Thuật để được trợ giúp thêm: %{contact_support_url}.'
