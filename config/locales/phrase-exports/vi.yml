  help:
    preferences_locale:
      locale:
        description: Tính năng này cho phép người dùng lựa chọn ngôn ngữ ưu tiên trong
          các email thông báo mà AO3 gửi tới người dùng. Văn bản mẫu của các thông
          báo này đang được cập nhật và biên dịch bởi các tình nguyện viên của chúng
          tôi. Đây là một dự án dài hạn và đang trong quá trình triển khai. Hiện tại,
          không phải tất cả các thông báo đều có bản dịch. Nếu văn bản mẫu cho thông
          báo chưa được dịch sang ngôn ngữ bạn lựa chọn, thông báo đó sẽ được gửi
          bằng Tiếng Anh.
