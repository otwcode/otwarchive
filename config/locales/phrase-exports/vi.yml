          của bạn sau một tuần kể từ ngày đổi tên, vui lòng %{contact_support_link}.
        text: 'Bạn có thể tham khảo FAQ của chúng tôi để tìm hiểu việc chỉnh sửa tên
          người dùng sẽ ảnh hưởng như thế nào tới tài khoản của bạn: %{refer_faq_url}.
          Nếu bạn gặp phải bất kỳ sự cố kỹ thuật nào, ví dụ như tác phẩm hoặc dấu
          trang vẫn hiển thị tên cũ của bạn sau một tuần kể từ ngày đổi tên, vui lòng
          liên hệ ban Hỗ Trợ Kỹ Thuật: %{contact_support_url}.'
