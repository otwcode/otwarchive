          html: Nếu bạn không xác nhận yêu cầu thay đổi này trước ngày %{date}, đường
            dẫn đính kèm trong email xác nhận này sẽ hết hạn và bạn sẽ phải %{email_change_form_link}
            lại lần nữa.
          text: 'Nếu bạn không xác nhận yêu cầu thay đổi này trước ngày %{date}, đường
            link đính kèm trong email xác nhận này sẽ hết hạn và bạn sẽ phải điền
            đơn yêu cầu thay đổi địa chỉ email lại lần nữa: %{email_change_form_link}.'
        confirm_email_change: xác nhận yêu cầu thay đổi này
        did_not_make_request: Nếu bạn không phải là người đưa ra yêu cầu thay đổi
          địa chỉ email này, bạn có thể bỏ qua và xóa thông báo này của chúng mình.
          Có lẽ ai đó đã điền nhầm địa chỉ email của bạn.
        email_change_form: điền đơn yêu cầu thay đổi địa chỉ email
        made_request:
          html:
            other: Nếu bạn là người yêu cầu thay đổi địa chỉ email, vui lòng đăng
              nhập và %{confirm_email_change_link} trong vòng %{count} ngày.
          text:
            other: 'Nếu bạn là người yêu cầu thay đổi địa chỉ email, hãy đăng nhập
              và xác nhận yêu cầu thay đổi này trong vòng %{count} ngày: %{confirm_email_change_link}'
        request_to_change_email_html: Ai đó đã yêu cầu thay đổi địa chỉ email %{app_name}
          gắn liền với tài khoản %{username}.
        subject: "[%{app_name}] Xác nhận yêu cầu thay đổi địa chỉ email"
