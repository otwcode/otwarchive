            để được hỗ trợ thêm."
          intro:
            other: Nếu bạn là người gửi yêu cầu này, vui lòng %{choose_new_password_link_imperative}
              trong vòng %{count} ngày.
          text:
            other: 'Nếu bạn là người gửi yêu cầu này, vui lòng sử dụng đường link
              này để chọn mật khẩu mới trong vòng %{count} ngày: %{choose_new_password_url}.
              Nếu đường link trong email này hết hạn, bạn cần yêu cầu đặt lại mật
