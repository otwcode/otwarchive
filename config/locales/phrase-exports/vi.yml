        change_your_password: thay đổi mật khẩu
        choose_new_password_imperative: dùng đường link này để thay đổi mật khẩu
        contact_policy_abuse: liên hệ Ban Chính Sách và Xử lý Lạm Quyền
        contact_policy_abuse_instructions:
          html: Nếu bạn có bất kỳ lý do nào khác để tin rằng ai đó hiện đang truy
            cập vào tài khoản %{app_name} của bạn, vui lòng %{contact_policy_abuse_link}
            kèm theo tất cả thông tin liên quan.
          text: 'Nếu bạn có bất kỳ lý do nào khác để tin rằng ai đó hiện đang truy
            cập vào tài khoản %{app_name} của bạn, vui lòng liên hệ Ban Chính Sách
            và Xử lý Lạm Quyền kèm theo tất cả thông tin liên quan: %{contact_policy_abuse_url}'
        contact_support: liên hệ Ban Hỗ trợ Kỹ Thuật
        ignore_if_not_requested:
          html: "%{safely_ignore_bold} Có thể ai đó đã nhập nhầm địa chỉ email của
            bạn."
          safely_ignore: Nếu bạn không gửi yêu cầu này, vui lòng bỏ qua email.
          text: Nếu bạn không gửi yêu cầu này, vui lòng bỏ qua email này. Có thể ai
            đó đã nhập nhầm địa chỉ email của bạn.
        instructions:
          html: "%{intro_bold} Nếu đường link trong email này đã hết hạn, vui lòng
            %{new_password_reset_link}. Nếu bạn gặp sự cố kỹ thuật, vui lòng đợi vài
