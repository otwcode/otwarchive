        changed: Mật khẩu cho tài khoản %{app_name} của bạn đã được thay đổi vào %{date}.
        did_not_make_change:
          contact_policy_abuse: liên hệ ban Chính Sách & Xử lý Lạm Quyền
          html: Nếu bạn không phải người thực hiện thay đổi này, ai đó có thể đã truy
            cập được vào tài khoản %{app_name} của bạn. Vui lòng %{reset_password_link}
            hoặc %{contact_policy_abuse_link}.
          reset_password: đặt lại mật khẩu ngay lập tức
          text: 'Nếu bạn không phải người thực hiện thay đổi này, ai đó có thể đã
            truy cập được vào tài khoản %{app_name} của bạn. Vui lòng đặt lại mật
            khẩu ngay lập tức (%{reset_password_url}) hoặc liên hệ ban Chính Sách
            & Xử lý Lạm Quyền: %{contact_policy_abuse_url}.'
        made_change:
          contact_support: liên hệ ban Hỗ trợ Kỹ Thuật
