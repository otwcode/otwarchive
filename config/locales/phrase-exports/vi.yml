            Nếu bạn đã quên rằng bạn thực hiện thay đổi, bạn có thể %{reset_password_link}.
            Nếu bạn gặp vấn đề kỹ thuật, vui lòng %{contact_support_link}.
          login: đăng nhập bằng mật khẩu mới
          reset_password: đặt lại mật khẩu
          text: 'Nếu bạn là người thực hiện thay đổi này, bạn có thể đăng nhập bằng
            mật khẩu mới (%{login_url}) hoặc đặt lại mật khẩu trong trường hợp bạn
