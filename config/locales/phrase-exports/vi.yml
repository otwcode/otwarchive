          bạn.
        new_password_reset: yêu cầu đặt lại mật khẩu một lần nữa
        reset_emails_clarification:
          html: Nếu bạn nhận được email đặt lại mật khẩu dù bạn không yêu cầu, tài
            khoản %{app_name} của bạn không nhất thiết đang gặp rủi ro. Miễn là bạn
            là người duy nhất có quyền truy cập vào tài khoản email của mình, tài
            khoản %{app_name} của bạn sẽ không bị ảnh hưởng và mật khẩu của bạn sẽ
            không thay đổi chỉ vì bạn nhận được email đặt lại mật khẩu này. Tuy nhiên,
            bạn vẫn có thể %{choose_new_password_link_modal} hoặc đăng nhập và %{change_your_password_link}.
            Cả hai tùy chọn đều sẽ đăng xuất tài khoản của bạn khỏi tất cả các phiên
            trên tất cả các thiết bị.
          text: 'Nếu bạn nhận được email đặt lại mật khẩu dù bạn không yêu cầu, tài
            khoản %{app_name} của bạn không nhất thiết đang gặp rủi ro. Miễn là bạn
            là người duy nhất có quyền truy cập vào tài khoản email của mình, tài
            khoản %{app_name} của bạn sẽ không bị ảnh hưởng và mật khẩu của bạn sẽ
            không thay đổi chỉ vì bạn nhận được email đặt lại mật khẩu này. Tuy nhiên,
            bạn vẫn có thể đi đến đường link này để thay đổi mật khẩu (%{choose_new_password_url})
            hoặc đăng nhập và thay đổi mật khẩu: %{change_your_password_url}. Cả hai
            tùy chọn đều sẽ đăng xuất tài khoản của bạn khỏi tất cả các phiên trên
            tất cả các thiết bị.'
        subject: "[%{app_name}] Đặt lại mật khẩu"
